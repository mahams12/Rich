<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Website accessibility checklist for Pakistani businesses</title>
<desc id="desc">NovexaHub editorial illustration showing a business contact form, visible keyboard focus, contrast checks and accessible interface controls.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d27"/><stop offset="1" stop-color="#253d49"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e8eee9"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d46e42"/><stop offset="1" stop-color="#f0a16f"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d9eee9" stroke-opacity=".08"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#071116" flood-opacity=".38"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
<circle cx="1080" cy="88" r="235" fill="#d46e42" opacity=".12"/><circle cx="620" cy="620" r="245" fill="#7cb6a4" opacity=".08"/>
<text x="76" y="82" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#c5ded7">NOVEXAHUB / WEB DESIGN</text>
<path d="M76 108h96" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
<text x="76" y="245" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#fffdf8">Accessible</text>
<text x="76" y="312" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#fffdf8">by design</text>
<text x="78" y="374" font-family="Arial,sans-serif" font-size="21" fill="#d4e4de">WCAG 2.2 · Keyboard · Contrast · Forms</text>
<text x="78" y="590" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#e9b18f">NOVEXAHUB / PRACTICAL DIGITAL PRODUCTS</text>
<g filter="url(#shadow)">
  <rect x="650" y="116" width="470" height="430" rx="28" fill="url(#panel)"/>
  <rect x="650" y="116" width="470" height="68" rx="28" fill="#edf1ec"/><path d="M650 156v28h470v-28" fill="#edf1ec"/>
  <circle cx="688" cy="150" r="8" fill="#d46e42"/><circle cx="715" cy="150" r="8" fill="#9cb8ad"/><circle cx="742" cy="150" r="8" fill="#9cb8ad"/>
  <text x="785" y="157" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#30464a">ACCESSIBLE CONTACT FORM</text>
  <text x="690" y="226" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#30464a">WORK EMAIL</text>
  <rect x="690" y="240" width="390" height="54" rx="12" fill="#fff" stroke="#8a9e95" stroke-width="2"/>
  <text x="712" y="274" font-family="Arial,sans-serif" font-size="16" fill="#64766f">name@company.com</text>
  <rect x="690" y="316" width="390" height="62" rx="14" fill="#fff" stroke="#d46e42" stroke-width="4"/>
  <rect x="698" y="324" width="374" height="46" rx="9" fill="#244b43"/>
  <text x="885" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fffdf8">Send enquiry</text>
  <rect x="690" y="402" width="180" height="104" rx="15" fill="#fff" stroke="#d7e0da"/>
  <text x="710" y="430" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#60756d">TEXT CONTRAST</text>
  <rect x="710" y="443" width="140" height="42" rx="8" fill="#244b43"/>
  <text x="780" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">4.5 : 1</text>
  <rect x="888" y="402" width="192" height="104" rx="15" fill="#fff" stroke="#d7e0da"/>
  <text x="908" y="430" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#60756d">KEYBOARD FOCUS</text>
  <circle cx="928" cy="466" r="15" fill="#d46e42"/><path d="M921 466l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="955" y="472" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#30464a">Visible</text>
</g>
